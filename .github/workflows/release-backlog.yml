name: Release backlog

# Daily read-only derivation of the source-release backlog (issue #317). The
# incident this answers was silence: a publisher died mid-flight and ten later
# merges queued behind it unnoticed for two weeks. This workflow only reads the
# public tag ledger and the Releases it should have produced, then records the
# result as exactly one issue naming the owner's command.
#
# It creates no tag, no Release and no workflow dispatch, and it holds neither
# the publication credential nor the settings App. Those stay in
# platform-release.yml and platform-release-recovery.yml, so an edit here can
# never reach publication authority.
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions: {}

# A slow read must never race the next day's read into two issue writes.
concurrency:
  group: platform-release-backlog
  cancel-in-progress: false

jobs:
  backlog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The single deviation from the read-only default token, scoped to this
      # one job: the alert is one issue. No contents, actions, packages or
      # id-token write is granted anywhere in this workflow.
      contents: read
      issues: write
    steps:
      - name: Check out the public tag ledger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Derive the backlog and record one issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/release_backlog.py watch \
            --repository . --head "${GITHUB_SHA}" \
            --api-repository "${GITHUB_REPOSITORY}" | tee -a "$GITHUB_STEP_SUMMARY"
