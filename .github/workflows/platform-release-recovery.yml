name: Platform source recovery

# A first attempt selects EVERY pending ledger edge once and the publish job
# drains them in order. Fresh dispatches serialize; rerunning jobs is refused
# before any privileged job can start.
on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: platform-source-recovery
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
      source_sha: ${{ steps.selection.outputs.source_sha }}
    steps:
      - name: Check out exact protected executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified release tools
        run: ./scripts/ci/install-tools.sh
      - name: Select every pending edge and prove original and executor CI
        id: selection
        env:
          RECOVERY_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I -B scripts/ci/platform_release_recovery.py prepare

  immutable-settings:
    needs: prepare
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && needs.prepare.outputs.selection != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: platform-release
      deployment: false
    permissions:
      actions: read
      contents: read
    outputs:
      attestation: ${{ steps.settings.outputs.attestation }}
    steps:
      - name: Check out exact protected executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified release tools
        run: ./scripts/ci/install-tools.sh
      - name: Revalidate the same selected edges before settings authority
        env:
          RECOVERY_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_SELECTION: ${{ needs.prepare.outputs.selection }}
        run: python3 -I -B scripts/ci/platform_release_recovery.py verify
      - name: Mint current-settings proof token
        id: settings-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PLATFORM_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLATFORM_RELEASE_APP_PRIVATE_KEY }}
          owner: snaraj
          repositories: platform
          permission-administration: read
          skip-token-revoke: false
          github-api-url: ${{ github.api_url }}
      # The immutable-release setting is repository-level, so it is proved ONCE
      # for the whole drain. Proving it per edge would mean minting the
      # Administration-read App token inside the write job, which is a
      # permission expansion rather than a stronger control; the write job
      # keeps only the ordinary job token and OIDC.
      - name: Verify current immutable-release setting
        id: settings
        env:
          IMMUTABLE_SETTINGS_TOKEN: ${{ steps.settings-token.outputs.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: bash scripts/ci/verify-platform-release-settings.sh

  publish:
    needs: [prepare, immutable-settings]
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      needs.prepare.outputs.selection != '' &&
      needs.immutable-settings.outputs.attestation ==
      format('PASS:{0}:{1}:{2}:{3}', github.repository, github.run_id,
      github.run_attempt, needs.prepare.outputs.source_sha)
    runs-on: ubuntu-24.04
    # Derived, not chosen: `publish_timeout_minutes()` in
    # scripts/ci/platform_release_recovery.py is PUBLISH_FIXED_MINUTES 6 plus
    # PUBLISH_EDGE_MINUTES 3 for each of the 46 edges `per_run_bounds` can
    # admit in one dispatch, so 6 + 3 x 46 = 144. The per-edge figure is
    # measured from the four single-edge dispatches of 2026-09-22/23, whose
    # in-loop publish work took 100-135 s each; the fixed figure is their
    # checkout and tool install. test_platform_recovery_wiring.py pins this
    # literal to that derivation.
    timeout-minutes: 144
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Check out exact protected executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified release tools
        run: ./scripts/ci/install-tools.sh
      - name: Publish every selected edge in ledger order
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_SELECTION: ${{ needs.prepare.outputs.selection }}
        run: bash scripts/ci/publish-platform-recovery.sh
