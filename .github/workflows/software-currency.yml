name: Software currency

on:
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out public pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check supported upstream releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/check_software_currency.py | tee -a "$GITHUB_STEP_SUMMARY"
