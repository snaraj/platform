name: Platform release

# Tip-only source publication (issue #397). A run publishes only the current
# protected-main tip, the commit whose workflow and scripts are executing,
# after its main CI and CodeQL succeeded, and the Release binds every fragment
# added since the previous Release. Publication names repository source only;
# it never deploys or promotes, and no owner action is part of the routine path.
on:
  workflow_run:
    workflows: [Pull request]
    types: [completed]
    branches: [main]
  # Reconciliation: a green tip left unpublished by a lost, replaced, cancelled
  # or failed trigger is published within the hour, with no owner action.
  schedule:
    - cron: '41 * * * *'

permissions: {}

# One writer. GitHub may replace a pending run; every run re-derives the tip,
# so the replacement or the next hourly run covers the replaced run's work.
concurrency:
  group: platform-release
  cancel-in-progress: false

jobs:
  admit:
    if: >-
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      decision: ${{ steps.admit.outputs.decision }}
      plan: ${{ steps.admit.outputs.plan }}
    steps:
      - name: Check out the protected-main tip that runs this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified release tools
        run: ./scripts/ci/install-tools.sh
      - name: Admit the tip, its CI and CodeQL, and the latest Release
        id: admit
        env:
          PLATFORM_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/platform_release_tip.py admit

  immutable-settings:
    needs: admit
    if: needs.admit.outputs.decision == 'publish' || needs.admit.outputs.decision == 'finalize'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: platform-release
      deployment: false
    permissions:
      contents: read
    outputs:
      attestation: ${{ steps.immutable-settings.outputs.attestation }}
    steps:
      - name: Check out the protected-main tip that runs this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Mint current-settings proof token
        id: immutable-settings-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PLATFORM_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLATFORM_RELEASE_APP_PRIVATE_KEY }}
          owner: snaraj
          repositories: platform
          permission-administration: read
          skip-token-revoke: false
          github-api-url: ${{ github.api_url }}
      - name: Verify current immutable-release setting
        id: immutable-settings
        env:
          IMMUTABLE_SETTINGS_TOKEN: ${{ steps.immutable-settings-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/ci/verify-platform-release-settings.sh

  # The finalization evidence: a v5 identity names this job, and verifiers
  # require it to have completed successfully. Everything it writes is private
  # and disposable until the publish job creates the tag ref.
  evidence:
    needs: [admit, immutable-settings]
    if: >-
      needs.admit.outputs.decision == 'publish' &&
      needs.immutable-settings.outputs.attestation ==
      format('PASS:{0}:{1}:{2}:{3}', github.repository, github.run_id,
      github.run_attempt, github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      id-token: write
    outputs:
      release_id: ${{ steps.stage.outputs.release_id }}
    steps:
      - name: Check out the protected-main tip that runs this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified release tools
        run: ./scripts/ci/install-tools.sh
      - name: Stage, sign and verify every Release byte before the commit point
        id: stage
        env:
          PLATFORM_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLAN: ${{ needs.admit.outputs.plan }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/platform_release_tip.py stage

  publish:
    needs: [admit, immutable-settings, evidence]
    if: >-
      !cancelled() &&
      needs.immutable-settings.outputs.attestation ==
      format('PASS:{0}:{1}:{2}:{3}', github.repository, github.run_id,
      github.run_attempt, github.sha) &&
      ((needs.admit.outputs.decision == 'publish' &&
      needs.evidence.result == 'success' &&
      needs.evidence.outputs.release_id != '') ||
      (needs.admit.outputs.decision == 'finalize' &&
      needs.evidence.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the protected-main tip that runs this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified release tools
        run: ./scripts/ci/install-tools.sh
      - name: Commit the tag and publish the immutable Release, or finalize it
        env:
          PLATFORM_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLAN: ${{ needs.admit.outputs.plan }}
          STAGED_RELEASE_ID: ${{ needs.evidence.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/platform_release_tip.py publish
