apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obsync-tls-proxy
  namespace: obsidian
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: obsync-tls-proxy
      app.kubernetes.io/instance: obsync-tls-proxy
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-public
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflare-public
              app.kubernetes.io/instance: obsync-tunnel
      ports:
        - {port: 8443, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: obsidian
          podSelector:
            matchLabels:
              app.kubernetes.io/name: obsync
              app.kubernetes.io/instance: obsync
      ports:
        - {port: 8080, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
