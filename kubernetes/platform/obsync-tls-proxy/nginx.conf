worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
worker_shutdown_timeout 30s;

events { worker_connections 256; }

http {
    # No request-derived log, cache or on-disk upload buffering. Health is
    # observed with probes and bounded client checks, never credential traces.
    access_log off;
    server_tokens off;
    client_max_body_size 0;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /etc/obsync-tls/tls.crt;
        ssl_certificate_key /etc/obsync-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        location / {
            # No URI suffix: preserve the request target used by app auth.
            proxy_pass http://obsync.obsidian.svc.cluster.local:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_max_temp_file_size 0;
            proxy_next_upstream off;
            proxy_redirect off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;

            # Strip standard forwarding and every edge-attribution field the
            # app consumes. Auth/cookie/protocol headers otherwise pass through.
            # The application additionally trusts no forwarded address range.
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Server "";
            proxy_set_header X-Real-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header CF-Connecting-IPv6 "";
            proxy_set_header CF-Pseudo-IPv4 "";
            proxy_set_header CF-IPCountry "";
            proxy_set_header CF-Ray "";
            proxy_set_header CF-Visitor "";
            proxy_set_header CF-Worker "";
            proxy_set_header CF-Access-Jwt-Assertion "";
        }
    }
}
