# One per connector, matching the cluster. NOT a universal rule and NOT a
# schema constant: the owner's ruling of 2026-08-12 is that a replica count
# must never be a hard limit, because a future application — or a stateful
# workload such as a database — may legitimately need more. What IS enforced
# is capacity: tests/security/test_namespace_capacity_contract.py requires a
# release's replicas AND its rolling-update surge headroom to fit inside its
# namespace's committed ResourceQuota, which permits 3 replicas where the quota
# affords them.
#
# BE PRECISE ABOUT WHAT THAT RULE SAYS HERE, because the obvious summary is
# wrong. With the surge-free strategy this chart ships, two replicas per
# connector are ALLOWED: four Pods at 500m/256Mi is 2000m of a 2000m
# limits.cpu budget and 1Gi of a 1Gi limits.memory budget — it fits, exactly.
# What the rule refuses is two replicas paired with a SURGING strategy, which
# is the combination this chart used to carry: `maxSurge: 1` then needs a
# fifth Pod that the budget cannot pay for, so the rollout is refused and the
# connectors become un-updatable without an outage. The trap was the pairing,
# never the count on its own.
#
# So why 1: the cluster is one node, a second replica buys no availability
# there, and two would consume the entire namespace budget with nothing spare
# for anything else that namespace ever needs. That is a judgement about this
# cluster, and the capacity rule is what would permit a different number the
# day a namespace affords one.
replicaCount: 1

image:
  repository: cloudflare/cloudflared
  tag: "2026.8.3"
  digest: sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
  pullPolicy: IfNotPresent

tunnel:
  secretKey: token

# One connector per website, each an independent Cloudflare Tunnel (ADR 0015).
# Keyed by site so Helm merges per connector: a HelmRelease may rotate ONE
# connector's tokenRevision without touching the other's rendered Deployment.
# Each entry is one exact identity tuple — instance, its own token Secret
# (referenced by NAME only; the token value lives solely in a cluster Secret),
# its own rotation revision, and its own origin — so no field of one site's
# connector can be paired with another site's.
connectors:
  naranjo-online:
    instance: naranjo-online-tunnel
    secretName: naranjo-online-tunnel-token
    # Change this non-secret revision in the same reviewed PR as that ONE
    # Tunnel's token rotation; the other connector is untouched.
    tokenRevision: not-configured
    origin:
      namespace: naranjo-online
      podLabels:
        app.kubernetes.io/name: naranjo-online
      port: 8080
  lidersea-com:
    instance: lidersea-com-tunnel
    secretName: lidersea-com-tunnel-token
    tokenRevision: not-configured
    origin:
      namespace: lidersea-com
      podLabels:
        app.kubernetes.io/name: lidersea-com
      port: 8080
  obsync:
    instance: obsync-tunnel
    secretName: obsync-tunnel-token
    tokenRevision: not-configured
    origin:
      namespace: obsidian
      # NOT the application, and that is the whole point of this entry.
      #
      # The obsync server speaks plain HTTP. A connector-matching rule on the
      # application would hand this connector direct access to that plain
      # listener, which is exactly the edge the reviewed design refuses: TLS
      # terminates in-cluster, in a DEDICATED PROXY WORKLOAD (a separate
      # platform workload, never a sidecar), so the only admitted edges are
      # connector -> proxy on the TLS port below and proxy -> application on
      # the application's HTTP port. No contributing policy allows
      # connector -> application.
      #
      # PENDING IDENTITY. The proxy's exact labels and port arrive with the
      # security lane's own reviewed deployment change and replace the three
      # values below in that same change. Until then these are a declared
      # placeholder that no Pod in this cluster carries, so this egress leg
      # selects nothing and the path fails CLOSED. That is deliberate: an
      # absent matching proxy is a route that does not work, whereas naming
      # the connector-to-application edge "temporarily" would be a route that
      # works and should not.
      podLabels:
        app.kubernetes.io/name: obsync-tls-proxy
      port: 8443

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
