# The active composition exactly as snaraj/platform-k8s-infra serves it:
# kubernetes/websites/hospedajedonlolo-com/{default-deny,source,release}.yaml at
# f00cbcf526c8bdca3435e7ae960579ecf458c225, the head of that repository's PR #87,
# byte for byte below this header. This policy must admit what the other
# repository actually reconciles. A readiness or audit-tag rule that disagrees
# with the real composition fails here rather than at the reconciler lift.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: hospedajedonlolo-com
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# hospedajedonlolo.com's Helm chart is published as a signed OCI artifact by that
# site's own release publisher. The immutable manifest digest below is the
# only selector source-controller consumes; the release annotation is the
# reviewed human label whose tag-to-digest mapping was independently resolved.
#
# The chart VERSION and the SIGNING REF are two different things. The version
# is audit metadata; the signature is minted by a
# workflow_dispatch run of the publisher selected from that repository's
# protected `main` branch, which its own reviewed release contract enforces, so
# the certificate identity ends in @refs/heads/main. That ref is the stronger
# anchor: a run at a ref executes the workflow definition AT that ref, and
# `refs/heads/main` is the only ref in that repository whose creation and
# update are gated by a ruleset with no bypass actors. Tag creation is not
# restricted there, so a tag-ref identity would be mintable by any holder of
# `contents: write` (ADR 0016 amendment 2026-08-22).
#
# Fail-closed properties this object carries, none of which may be relaxed
# without a reviewed decision:
#
#   * spec.verify is MANDATORY. source-controller refuses to produce an
#     artifact for a chart that carries no cosign signature, or one signed by
#     any identity other than THIS site's release-publisher workflow running on
#     protected `main`. The subject pattern is anchored end to end so the
#     sibling site's publisher, another workflow in the same repository, a run
#     at any other ref — a tag ref included — and any look-alike host are all
#     rejected: the two site identity tuples must never couple (AGENTS.md
#     safety invariant 14).
#   * spec.ref contains exactly one nonzero sha256 digest. Moving, deleting,
#     or replacing a registry tag cannot change the bytes Flux selects. A new
#     site release reaches the cluster only through a reviewed platform change
#     that re-resolves the human tag and verifies the new digest and signer.
#   * No secretRef, serviceAccountName, certSecretRef, or proxySecretRef: the
#     registry is read anonymously and the cluster holds no registry
#     credential, exactly as it holds no Git credential (ADR 0003, safety
#     invariant 5).
#   * The layer selector pins the Helm chart media type, so a non-chart layer
#     smuggled into the artifact is not what gets reconciled.
#   * spec.interval is the ceiling on how long a merged selection waits before
#     source-controller re-reads this object. It is a poll of one already
#     signature-verified OCI reference, so shortening it adds no credential, no
#     inbound path and no new object — a Flux Receiver would have added all
#     three (issue #309). One minute keeps the merge-to-live loop bounded by
#     the release ceremony rather than by a timer.
#
# The chart is also the sole workload image-identity carrier; platform
# HelmRelease values contain no repository, tag, or digest override (ADR 0016).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  annotations:
    platform.snaraj.dev/chart-release: "0.1.1"
  name: hospedajedonlolo-com-chart
  namespace: hospedajedonlolo-com
spec:
  interval: 1m0s
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:2cd06606dbd39bab83ce86ab3f0c432afe8380e1367a92de51131d3ee7280a61
  timeout: 60s
  url: oci://ghcr.io/snaraj/charts/hospedajedonlolo-com
  verify:
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/snaraj/hospedajedonlolo\.com/\.github/workflows/release-publisher\.yml@refs/heads/main$
    provider: cosign
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hospedajedonlolo-com
  namespace: hospedajedonlolo-com
  labels:
    app.kubernetes.io/managed-by: fluxcd
  annotations:
    platform.snaraj.dev/readiness: active-via-signature-verified-chart
spec:
  suspend: false
  # One minute is the ceiling on how long a merged chart selection waits for
  # helm-controller to act on it. Like the OCIRepository beside this file it is
  # a poll of already-verified state, so the shorter interval buys deploy
  # latency with no webhook receiver, no inbound path and no new object
  # (issue #309).
  interval: 1m0s
  # Helm keeps every release revision as a Secret in this namespace, and
  # helm-controller retains five when this field is unset. `storage.Create`
  # prunes history to maxHistory-1 BEFORE writing the new revision, so any
  # retention default at or above the namespace secret budget wedges the
  # release permanently: the prune frees nothing, the create is denied by
  # quota, and no retry can recover it. This site was measured holding four
  # revisions against a four-Secret budget — the next upgrade would have been
  # the one denied (issue #198). Two keeps steady-state history strictly
  # inside that budget while still preserving one rollback target for the
  # `strategy: rollback` remediation below.
  maxHistory: 2
  releaseName: hospedajedonlolo-com
  serviceAccountName: helm-reconciler
  driftDetection:
    mode: enabled
  # The chart artifact comes from the signature-verified OCIRepository beside
  # this file, whose immutable digest is a reviewed platform value — no branch
  # head, mutable tag, or raw commit can decide what runs. chartRef carries no namespace, so helm-controller
  # (started with --no-cross-namespace-refs=true) can only ever resolve it
  # inside this site's own namespace.
  chartRef:
    kind: OCIRepository
    name: hospedajedonlolo-com-chart
  install:
    remediation:
      retries: 0
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
      strategy: rollback
  # The exact-site Cosign-verified chart is the sole carrier of image
  # repository, tag, and digest. A platform image override would decouple the
  # selected chart release from the workload it deploys. This one explicit
  # value remains the chart's reviewed activation gate.
  values:
    deploymentReady: true
