    remediation:
      retries: 0
      strategy: rollback
  values:
    deploymentReady: true
    image:
      tag: latest
---
# The release impersonating the obsync APPLICATION account instead of this
# namespace's generic site account.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hospedajedonlolo-com
  namespace: hospedajedonlolo-com
  labels:
    app.kubernetes.io/managed-by: fluxcd
spec:
  suspend: true
  interval: 1m0s
  maxHistory: 2
  releaseName: hospedajedonlolo-com
  serviceAccountName: obsync-helm-reconciler
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: hospedajedonlolo-com-chart
  install:
    remediation:
      retries: 0
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
      strategy: rollback
  values:
    deploymentReady: true
---
# The budget wearing obsync's reviewed map and evidence hash. Both are
# individually approved values; neither is this namespace's.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: hospedajedonlolo-com
  annotations:
    platform.snaraj.dev/readiness: reviewed-pi-capacity
    platform.snaraj.dev/capacity-evidence-sha256: b929123457f9a95d9643eb0d550f5def7b27e794d4b8e28374ed460c1c9836e7
spec:
  hard:
    pods: "4"
    requests.cpu: 450m
    requests.memory: 384Mi
    limits.cpu: 5000m
    limits.memory: 2560Mi
---
# Site EGRESS. The decided shape for this site is lidersea's: Ingress and
# Egress policy types with no egress rule at all. A brochure server has nothing
# to call, so an egress rule is a widening with no reviewed purpose.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hospedajedonlolo-com-egress
  namespace: hospedajedonlolo-com
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hospedajedonlolo-com
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
---
# The site's reconciler reaching ANOTHER site's application directory. The
# policy pins the path per reconciler name.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hospedajedonlolo-com-reconciler
  namespace: flux-system
spec:
  suspend: true
  interval: 1m0s
  path: ./kubernetes/websites/lidersea-com
  prune: false
  deletionPolicy: Orphan
  wait: true
  serviceAccountName: hospedajedonlolo-com-reconciler
  targetNamespace: hospedajedonlolo-com
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# The site's reconciler borrowing ANOTHER site's reconciler identity.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hospedajedonlolo-com-reconciler
  namespace: flux-system
spec:
  suspend: true
  interval: 1m0s
  path: ./kubernetes/websites/hospedajedonlolo-com
  prune: false
  deletionPolicy: Orphan
  wait: true
  serviceAccountName: lidersea-com-reconciler
  targetNamespace: hospedajedonlolo-com
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# A site Pod running as ANOTHER site's workload ServiceAccount.
apiVersion: v1
kind: Pod
metadata:
  name: hospedajedonlolo-with-a-sibling-account
  namespace: hospedajedonlolo-com
spec:
  automountServiceAccountToken: false
  serviceAccountName: lidersea-com
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: hospedajedonlolo-com
      image: ghcr.io/snaraj/hospedajedonlolo-com@sha256:1111111111111111111111111111111111111111111111111111111111111111
      resources:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {cpu: 200m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
---
# The namespace without its restricted Pod Security enforcement. Audit and
# warn alone only report what enforce would have refused.
apiVersion: v1
kind: Namespace
metadata:
  name: hospedajedonlolo-com
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
