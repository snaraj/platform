# Hostile variants of the operator artifact in
# docs/runbooks/artifacts/obsync-reconciler.yaml. Each is one field away from
# the reviewed bytes, and each is the change a hurried operator would most
# plausibly make. The allow fixture beside this one is the artifact itself, so
# together they prove the policy accepts exactly the reviewed shape and nothing
# adjacent to it.
# `wait: false`, which the reviewed policy refuses for every approved
# reconciler: an apply that does not wait reports success over a wedged
# release. The first draft of the runbook carried exactly this value, so
# this document is the review finding itself, frozen.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: obsync-reconciler
  namespace: flux-system
spec:
  # Created SUSPENDED. The composition it applies carries the fail-closed
  # sentinel digest and a suspended HelmRelease, so an unsuspended reconciler
  # would apply a release that installs nothing and report an error for it.
  # Lifting this is §3 step 2, after the promotion merges.
  suspend: true
  interval: 1m0s
  retryInterval: 2m0s
  timeout: 3m0s
  # Exactly one application directory. The reviewed policy pins this string per
  # reconciler name, so a path that reached a sibling application would be
  # refused before it was ever applied.
  path: ./kubernetes/websites/obsync
  # `prune: false` and `deletionPolicy: Orphan` are why removing this object
  # later cannot delete a tenant's live resources. Both are required by policy
  # rather than chosen here.
  prune: false
  force: false
  deletionPolicy: Orphan
  # Required by policy for every approved reconciler: the apply is not reported
  # successful until what it applied is actually ready, so a wedged release is
  # visible rather than silently "applied".
  wait: false
  # The whole surface through which anything is applied. Without it the apply
  # would run as kustomize-controller itself, which is the escalation path the
  # impersonation model exists to close.
  serviceAccountName: obsync-reconciler
  targetNamespace: obsidian
  sourceRef:
    kind: GitRepository
    name: flux-system

