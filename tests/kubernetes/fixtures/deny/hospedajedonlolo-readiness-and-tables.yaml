# Issue #422, review of platform PR #425: the readiness rule for active sites
# and the three per-site table memberships that previously had no attributed
# negative. Each document trips exactly the arms its .expected sidecar names.
# The rule's pending direction is unit-tested in
# policies/conftest/site_readiness_test.rego, since no website is pending
# (issue #429).
# Issue #422 finding 4: a third-site Role granting pods/exec. Only the table
# membership in restricted_role_namespaces makes this arm fire for the site.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: site-exec
  namespace: hospedajedonlolo-com
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
# A third-site HelmRelease under an unrelated name and releaseName, otherwise
# the canonical active release. Only workload_release_names makes both
# identity arms fire for the site.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: other-release
  namespace: hospedajedonlolo-com
  labels:
    app.kubernetes.io/managed-by: fluxcd
  annotations:
    platform.snaraj.dev/readiness: active-via-signature-verified-chart
spec:
  suspend: false
  interval: 1m0s
  maxHistory: 2
  releaseName: other-release
  serviceAccountName: helm-reconciler
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: hospedajedonlolo-com-chart
  install:
    remediation:
      retries: 0
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
      strategy: rollback
  values:
    deploymentReady: true
---
# A third-site OCIRepository under an unrelated name, otherwise the canonical
# active source. Only site_chart_sources makes the identity arm fire.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  annotations:
    platform.snaraj.dev/chart-release: "0.1.1"
  name: other-chart
  namespace: hospedajedonlolo-com
spec:
  interval: 1m0s
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:2cd06606dbd39bab83ce86ab3f0c432afe8380e1367a92de51131d3ee7280a61
  timeout: 60s
  url: oci://ghcr.io/snaraj/charts/hospedajedonlolo-com
  verify:
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/snaraj/hospedajedonlolo\.com/\.github/workflows/release-publisher\.yml@refs/heads/main$
    provider: cosign
---
# This ACTIVE site withdrawing readiness. Its selection is the reviewed digest,
# so the only true statement is deploymentReady: true.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hospedajedonlolo-com
  namespace: hospedajedonlolo-com
  labels:
    app.kubernetes.io/managed-by: fluxcd
  annotations:
    platform.snaraj.dev/readiness: active-via-signature-verified-chart
spec:
  suspend: false
  interval: 1m0s
  maxHistory: 2
  releaseName: hospedajedonlolo-com
  serviceAccountName: helm-reconciler
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: hospedajedonlolo-com-chart
  install:
    remediation:
      retries: 0
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
      strategy: rollback
  values:
    deploymentReady: false
---
# A sibling ACTIVE site (naranjo.online's real release from
# snaraj/platform-k8s-infra) withdrawing readiness, so the rule is not special
# to this namespace. An active site states true.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: naranjo-online
  namespace: naranjo-online
  labels:
    app.kubernetes.io/managed-by: fluxcd
  annotations:
    platform.snaraj.dev/readiness: active-via-signature-verified-chart
spec:
  suspend: false
  interval: 1m0s
  maxHistory: 2
  releaseName: naranjo-online
  serviceAccountName: helm-reconciler
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: naranjo-online-chart
  install:
    remediation:
      retries: 0
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
      strategy: rollback
  values:
    deploymentReady: false
