# Cross-site reachability, hospedajedonlolo direction (issue #422): the new
# connector (instance=hospedajedonlolo-com-tunnel) attempts egress to ANOTHER
# site's origin (lidersea-com). Denied: a connector-egress policy's selected
# instance and its target origin must be the same site.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-hospedajedonlolo-com
  namespace: cloudflare-public
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-public
      app.kubernetes.io/instance: hospedajedonlolo-com-tunnel
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lidersea-com
          podSelector:
            matchLabels:
              app.kubernetes.io/name: lidersea-com
      ports:
        - port: 8080
          protocol: TCP
