# Managed by bootstrap/pi/hardening. Same reasoning as containerd: kubelet
# manages cgroups, mounts and devices for pods; only the unrelated fences apply.
[Service]
ProtectHome=yes
ProtectKernelLogs=yes
ProtectHostname=yes
ProtectClock=yes
LockPersonality=yes
RestrictRealtime=yes
SystemCallArchitectures=native
