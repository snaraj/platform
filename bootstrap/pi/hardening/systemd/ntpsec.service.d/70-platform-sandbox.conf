# Managed by bootstrap/pi/hardening. ntpd must set the clock and bind 123, and
# drops to its own user by itself; everything else is fenced. ProtectClock is
# deliberately absent: it would block the one thing the daemon exists to do.
[Service]
CapabilityBoundingSet=CAP_SYS_TIME CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_SYS_CHROOT CAP_SYS_NICE
NoNewPrivileges=yes
ProtectSystem=strict
# The statistics directory is optional on this host; /run holds the PID file.
ReadWritePaths=/var/lib/ntpsec -/var/log/ntpsec /run
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service @clock @setuid
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
