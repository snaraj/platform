# Managed by bootstrap/pi/hardening. A container runtime needs mounts,
# namespaces and most capabilities, so it cannot be sandboxed like a daemon.
# These fences cost it nothing and remove what it never touches.
[Service]
ProtectHome=yes
ProtectKernelLogs=yes
ProtectHostname=yes
ProtectClock=yes
LockPersonality=yes
RestrictRealtime=yes
SystemCallArchitectures=native
