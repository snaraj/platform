// Managed by bootstrap/pi/hardening. Unattended upgrades install security
// updates only; feature updates wait for an operator. Reboots stay with the
// owner, so Automatic-Reboot is off and needrestart reports what a reboot
// would clear. Nested scope syntax is used on purpose: the repository privacy
// gate reads the usual scope separator inside this option name as an address.
Unattended-Upgrade {
    Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
    };
    Remove-Unused-Kernel-Packages "true";
    Remove-New-Unused-Dependencies "true";
    Remove-Unused-Dependencies "true";
    Automatic-Reboot "false";
    SyslogEnable "true";
};
