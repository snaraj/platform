# Managed by bootstrap/pi/hardening. Restart ordinary services automatically
# after a library update; never restart the container runtime or kubelet
# unattended, and never act on the kernel: the owner reboots.
$nrconf{restart} = 'a';
$nrconf{kernelhints} = 1;
$nrconf{override_rc}{q(^containerd\.service)} = 0;
$nrconf{override_rc}{q(^kubelet\.service)} = 0;
$nrconf{override_rc}{q(^cloudflared\.service)} = 0;
